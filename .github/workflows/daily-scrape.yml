name: Daily Tender Scraper

on:
  schedule:
    # Every day at 11:00 AM IST
    # IST = UTC +5:30 → 11:00 IST = 05:30 UTC
    - cron: '30 5 * * *'

  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: DEBUG - Check SERVICE_ACCOUNT_JSON secret
      run: |
        echo "=== SECRET DEBUG START ==="
        echo "Is secret defined? ${{ secrets.SERVICE_ACCOUNT_JSON != '' }}"
        echo "Secret length: $(printf '%s' '${{ secrets.SERVICE_ACCOUNT_JSON }}' | wc -c)"
        echo "First 20 chars: $(printf '%s' '${{ secrets.SERVICE_ACCOUNT_JSON }}' | head -c 20)"
        echo "Last 20 chars:  $(printf '%s' '${{ secrets.SERVICE_ACCOUNT_JSON }}' | tail -c 20 | rev | cut -c1-20 | rev)"
        echo "=== SECRET DEBUG END ==="

    - name: Create service account file from secret
      run: |
        if [ -z "${{ secrets.SERVICE_ACCOUNT_JSON }}" ]; then
          echo "ERROR: SERVICE_ACCOUNT_JSON secret is missing or empty"
          exit 1
        fi
        
        echo "${{ secrets.SERVICE_ACCOUNT_JSON }}" > service_account.json
        echo "service_account.json created from secret"
        ls -l service_account.json
        echo "File size: $(ls -l service_account.json | awk '{print $5}') bytes"

    - name: Run scraper
      run: python main.py

    # Optional: commit any changes (logs, debug files, etc.)
    - name: Commit any changes (optional)
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add .
        git commit -m "Daily scrape update $(date)" || echo "No changes to commit"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
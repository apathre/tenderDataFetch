name: Daily Tender Scraper

on:
  schedule:
    # Every day at 11:00 AM IST → 05:30 UTC
    - cron: '30 5 * * *'

  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create service account file and export secret
      env:
        SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
      run: |
        echo "=== SECRET DEBUG START ==="
        echo "Is secret defined in env? ${SERVICE_ACCOUNT_JSON:+true}"
        echo "Secret length: ${#SERVICE_ACCOUNT_JSON}"
        echo "First 20 chars: ${SERVICE_ACCOUNT_JSON:0:20}"
        echo "Last 20 chars: ${SERVICE_ACCOUNT_JSON: -20}"
        echo "=== SECRET DEBUG END ==="

        if [ -z "$SERVICE_ACCOUNT_JSON" ]; then
          echo "ERROR: Secret is empty in Python environment"
          exit 1
        fi

        echo "$SERVICE_ACCOUNT_JSON" > service_account.json
        echo "service_account.json created"
        ls -l service_account.json

    - name: Run scraper
      run: python main.py

    # Optional: commit logs/changes
    - name: Commit any changes
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add .
        git commit -m "Daily scrape update $(date)" || echo "No changes"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
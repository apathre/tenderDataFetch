name: Daily Tender Scraper

on:
  schedule:
    # Every day at 11:00 AM IST → 05:30 UTC
    - cron: '30 5 * * *'

  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    # ────────────────────────────────────────────────
    # Make the secret available as env var to ALL steps in this job
    # ────────────────────────────────────────────────
    env:
      SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: DEBUG - Check SERVICE_ACCOUNT_JSON in job env
      run: |
        echo "=== JOB-LEVEL SECRET DEBUG START ==="
        echo "Is secret defined in job env? ${SERVICE_ACCOUNT_JSON:+true}"
        echo "Secret length in job env: ${#SERVICE_ACCOUNT_JSON}"
        echo "First 20 chars: ${SERVICE_ACCOUNT_JSON:0:20}"
        echo "Last 20 chars: ${SERVICE_ACCOUNT_JSON: -20}"
        echo "=== JOB-LEVEL SECRET DEBUG END ==="

        if [ -z "$SERVICE_ACCOUNT_JSON" ]; then
          echo "ERROR: Secret is empty at job level"
          exit 1
        fi

    - name: Create service account file from secret
      run: |
        echo "Creating service_account.json from secret..."
        echo "$SERVICE_ACCOUNT_JSON" > service_account.json
        echo "File created. Size: $(ls -l service_account.json | awk '{print $5}') bytes"
        ls -l service_account.json

    - name: Run scraper with debug
      run: |
        echo "=== PYTHON ENVIRONMENT DEBUG ==="
        echo "SERVICE_ACCOUNT_JSON length in Python: $(python -c 'import os; print(len(os.getenv(\"SERVICE_ACCOUNT_JSON\", \"\")))')"
        echo "First 20 chars from Python: $(python -c 'import os; s=os.getenv(\"SERVICE_ACCOUNT_JSON\", \"\"); print(s[:20])')"
        echo "=== STARTING SCRAPER ==="
        python main.py

    # Optional: commit any changes (logs, debug files, etc.)
    - name: Commit any changes
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add .
        git commit -m "Daily scrape update $(date)" || echo "No changes to commit"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
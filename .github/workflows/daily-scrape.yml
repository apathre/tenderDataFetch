name: Daily Tender Scraper

on:
  schedule:
    # Every day at 11:00 AM IST
    # IST = UTC +5:30 → 11:00 IST = 05:30 UTC
    - cron: '30 5 * * *'

  # Allow manual run from GitHub UI (useful for testing)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Debug SERVICE_ACCOUNT_JSON secret
      run: |
        echo "SECRET_EXISTS: ${{ secrets.SERVICE_ACCOUNT_JSON != '' }}"
        echo "SECRET_LENGTH: ${{ secrets.SERVICE_ACCOUNT_JSON != '' && length(secrets.SERVICE_ACCOUNT_JSON) || '0' }}"
        # Do NOT echo the full secret — it would appear in logs
        # But we can check if it's valid JSON length-wise
        if [ -n "${{ secrets.SERVICE_ACCOUNT_JSON }}" ]; then
          echo "Secret is present (length > 0)"
        else
          echo "Secret is missing or empty"
        fi

    - name: Create service account file from secret
      if: ${{ secrets.SERVICE_ACCOUNT_JSON != '' }}
      run: |
        echo "${{ secrets.SERVICE_ACCOUNT_JSON }}" > service_account.json
        echo "service_account.json file created from secret"
        ls -l service_account.json   # confirm file exists

    - name: Run scraper
      run: python main.py

    # Optional: commit any new debug files or logs if you want
    - name: Commit changes (if any)
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add .
        git commit -m "Daily scrape update $(date)" || echo "No changes to commit"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}